name: Publish To PyPI

on:
  release:
    types:
      - published
  workflow_dispatch:

# Only a version tag publishes. Corpus artifacts are attached to their own `corpora-*` release, and
# without this guard creating that release fires this workflow and tries to upload whatever version
# pyproject happens to carry -- a release that is not a release of the package.
permissions:
  contents: read

# Numerical kernels stay single-threaded; tests exercise explicit native budgets separately.
env:
  POLARS_MAX_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  RAYON_NUM_THREADS: "1"

jobs:
  build:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'v') }}
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      # Pure-Python (hatchling): one sdist + one py3-none-any wheel, no cibuildwheel matrix.
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  test:
    name: Test built wheel before publishing
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - name: Install wheel and test dependencies
        run: |
          python -m pip install dist/*.whl
          python -m pip install pytest kneed matplotlib lifelines biopython
      - name: Test installed artifact
        run: pytest tests/ -q -m "not integration and not benchmark" --durations=25

  publish:
    if: >-
      ${{ github.event_name == 'release' &&
      startsWith(github.event.release.tag_name, 'v') }}
    name: Publish To PyPI
    needs: [build, test]
    # Only a published GitHub Release publishes to PyPI; workflow_dispatch runs build as a dry run
    # (no upload, never enters the pypi environment) so the release build can be tested.
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write  # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - name: Validate package version matches release tag
        run: |
          # PEP 440 comparison, so a tag like v3.1.0-alpha.0 matches version 3.1.0a0. The version
          # is read off the built wheel (hatchling takes it from src/mir/__init__.py::__version__),
          # so this checks what actually gets uploaded rather than a second copy in a manifest.
          python -m pip install --quiet packaging
          python - <<'PY'
          from pathlib import Path
          from packaging.version import Version
          wheel = next(Path("dist").glob("*.whl")).name   # mirpy_lib-<version>-py3-none-any.whl
          version = wheel.split("-")[1]
          tag = "${{ github.event.release.tag_name }}"
          norm = tag[1:] if tag.startswith("v") else tag
          if Version(version) != Version(norm):
              raise SystemExit(f"Version mismatch: wheel={version!r} != tag {tag!r} (normalized {norm!r})")
          print(f"Version OK: wheel {version} == tag {tag}")
          PY
      - name: List distributions
        run: ls -R dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
